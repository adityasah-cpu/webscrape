<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centurion Nextgen Novagig - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 32px;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
            margin: 0 auto;
            display: block;
        }

        h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 12px;
            font-weight: 800;
            margin-top: 20px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        #googleSignInButton {
            margin: 24px 0;
            display: flex;
            justify-content: center;
        }

        .info-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            font-size: 13px;
            color: #4b5563;
            line-height: 1.6;
        }

        .info-box strong {
            color: #1f2937;
            display: block;
            margin-bottom: 8px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }

        @media (prefers-color-scheme: dark) {
            .login-container {
                background: #1f2937;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            }

            h1 {
                color: #f9fafb;
            }

            .subtitle {
                color: #d1d5db;
            }

            .info-box {
                background: #111827;
                color: #b4bcd0;
            }

            .info-box strong {
                color: #f9fafb;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="/static/centurion-logo.png" alt="Centurion Logo" class="logo">
        </div>

        <h1>Centurion Nextgen Novagig</h1>
        <p class="subtitle">Sign in with your Google account to continue</p>

        <div class="error" id="errorBox"></div>

        <div id="googleSignInButton"></div>

        <div class="loading" id="loadingBox">
            <div class="loading-spinner"></div>
            <p>Signing in...</p>
        </div>

        <div class="info-box">
            <strong>🔒 Secure Login</strong>
            Sign in securely using your Google account. We never store your password.
        </div>
    </div>

    <script>
        const API_URL = '/';
        const errorBox = document.getElementById('errorBox');
        const loadingBox = document.getElementById('loadingBox');
        const signInButton = document.getElementById('googleSignInButton');

        // Handle Google credential response
        function handleCredentialResponse(response) {
            loadingBox.style.display = 'block';
            signInButton.style.display = 'none';
            errorBox.style.display = 'none';

            // Send token to backend
            fetch('/api/auth/google', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify({
                    credential: response.credential
                })
            })
            .then(res => {
                if (res.status === 403) {
                    return res.json().then(data => {
                        throw new Error(data.error || 'Your email domain is not authorized. Please use an allowed institutional email.');
                    });
                }
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    console.log('✅ Login successful:', data.user);
                    // Redirect to home page after short delay
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            })
            .catch(error => {
                console.error('❌ Login error:', error);
                loadingBox.style.display = 'none';
                signInButton.style.display = 'block';
                errorBox.style.display = 'block';
                errorBox.textContent = error.message || 'Failed to sign in. Please try again.';
            });
        }

        // Initialize Google Sign-In
        window.onload = function() {
            fetch('/api/auth/config')
                .then(res => res.json())
                .then(data => {
                    if (!data.google_client_id) {
                        throw new Error('Google Sign-In not configured');
                    }

                    google.accounts.id.initialize({
                        client_id: data.google_client_id,
                        callback: handleCredentialResponse,
                        auto_select: false,
                    });

                    google.accounts.id.renderButton(
                        document.getElementById('googleSignInButton'),
                        {
                            theme: 'outline',
                            size: 'large',
                            shape: 'pill',
                            width: '300'
                        }
                    );
                })
                .catch(error => {
                    console.error('❌ Failed to initialize Google Sign-In:', error);
                    errorBox.style.display = 'block';
                    errorBox.textContent = 'Failed to load Google Sign-In. Please refresh the page.';
                });
        };
    </script>
</body>
</html>
