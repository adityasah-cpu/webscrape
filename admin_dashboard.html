<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #48bb78;
            --warning: #f6ad55;
            --danger: #f56565;
            --info: #4299e1;
            --light: #f7fafc;
            --dark: #1a202c;
            --text: #2d3748;
            --border: #e2e8f0;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 20px 40px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 300;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .selector-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .selector-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex: 1;
            min-width: 300px;
        }

        .selector-group label {
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .selector-group select {
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: white;
            color: var(--text);
            flex: 1;
            transition: all 0.3s ease;
        }

        .selector-group select:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .selector-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        .selector-group select option {
            color: var(--text);
            background: white;
            padding: 10px;
        }

        .btn-load {
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-load:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #c53030;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--primary);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card.success { border-top-color: var(--success); }
        .stat-card.warning { border-top-color: var(--warning); }
        .stat-card.danger { border-top-color: var(--danger); }

        .stat-card h3 {
            font-size: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .stat-card .sublabel {
            font-size: 13px;
            color: #718096;
            position: relative;
            z-index: 1;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .chart-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .chart-card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-card h2 span {
            font-size: 24px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
            margin-bottom: 16px;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-card h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            padding: 28px 28px 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-bottom: 2px solid var(--border);
        }

        table th {
            padding: 16px 28px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table td {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text);
        }

        table tbody tr:hover {
            background: #f7fafc;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .selector-group {
                flex-direction: column;
                align-items: stretch;
            }

            .selector-group select {
                flex: auto;
            }

            .stat-card .value {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Analytics Dashboard</h1>
        <p>Location-Based Management & Insights</p>
    </div>

    <div class="container">
        <div class="selector-card">
            <div class="selector-group">
                <label for="locationSelect">📍 Location:</label>
                <select id="locationSelect">
                    <option value="">-- Choose a Location --</option>
                </select>
            </div>
            <button class="btn-load" onclick="loadDashboard()">Load Dashboard</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div id="statsContainer" style="display: none;">
            <!-- Stats Grid -->
            <div class="stats-grid" id="statsGrid"></div>

            <!-- Charts Grid -->
            <div class="charts-grid">
                <div class="chart-card">
                    <h2><span>📤</span>CV Upload Status</h2>
                    <div class="chart-wrapper">
                        <canvas id="cvChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h2><span>📈</span>Engagement Funnel</h2>
                    <div class="chart-wrapper">
                        <canvas id="funnelChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Details Table -->
            <div class="table-card">
                <h2><span>👥</span>Engagement Funnel Details</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Stage</th>
                            <th>Users</th>
                            <th>Percentage</th>
                            <th>Trend</th>
                        </tr>
                    </thead>
                    <tbody id="engagementTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/admin';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadLocations();
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('statsContainer').style.display = 'none';
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }

        async function loadLocations() {
            try {
                const response = await fetch(`${API_URL}/locations`);
                const data = await response.json();

                if (!data.success || !data.locations) {
                    showError('Failed to load locations');
                    return;
                }

                const select = document.getElementById('locationSelect');
                data.locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location;
                    select.appendChild(option);
                });

                // Auto-select first location
                if (data.locations.length > 0) {
                    select.value = data.locations[0];
                }
            } catch (error) {
                console.error('Error loading locations:', error);
                showError('Error loading locations: ' + error.message);
            }
        }

        async function loadDashboard() {
            const location = document.getElementById('locationSelect').value;

            if (!location) {
                showError('Please select a location');
                return;
            }

            hideError();
            document.getElementById('statsContainer').style.display = 'block';

            try {
                // Load all data in parallel
                const [statsRes, engagementRes] = await Promise.all([
                    fetch(`${API_URL}/location-stats/${location}`),
                    fetch(`${API_URL}/location-engagement/${location}`)
                ]);

                if (!statsRes.ok) {
                    showError(`Failed to load stats: ${statsRes.status}`);
                    return;
                }

                if (!engagementRes.ok) {
                    showError(`Failed to load engagement: ${engagementRes.status}`);
                    return;
                }

                const statsData = await statsRes.json();
                const engagementData = await engagementRes.json();

                if (!statsData.success || !engagementData.success) {
                    showError('Failed to load dashboard data');
                    return;
                }

                updateDashboard(statsData, engagementData);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('Error: ' + error.message);
            }
        }

        function updateDashboard(stats, engagement) {
            updateStatsCards(stats);
            updateCharts(stats, engagement);
            updateEngagementTable(engagement);
        }

        function updateStatsCards(data) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value">${data.total_users || 0}</div>
                </div>
                <div class="stat-card success">
                    <h3>CV Uploaded</h3>
                    <div class="value">${data.cv_uploaded_yes || 0}</div>
                    <div class="sublabel">${data.total_users > 0 ? Math.round((data.cv_uploaded_yes / data.total_users) * 100) : 0}% of users</div>
                </div>
                <div class="stat-card warning">
                    <h3>Jobs Clicked</h3>
                    <div class="value">${data.total_jobs_clicked || 0}</div>
                </div>
                <div class="stat-card danger">
                    <h3>Jobs Applied</h3>
                    <div class="value">${data.total_jobs_applied || 0}</div>
                </div>
            `;
        }

        function updateCharts(stats, engagement) {
            // CV Upload Chart
            const cvCtx = document.getElementById('cvChart').getContext('2d');
            new Chart(cvCtx, {
                type: 'doughnut',
                data: {
                    labels: ['CV Uploaded', 'No CV'],
                    datasets: [{
                        data: [stats.cv_uploaded_yes || 0, stats.cv_uploaded_no || 0],
                        backgroundColor: ['#48bb78', '#cbd5e0'],
                        borderColor: ['#38a169', '#a0aec0'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        datalabels: { color: '#fff', font: { weight: 'bold' } }
                    }
                }
            });

            // Funnel Chart
            const funnelCtx = document.getElementById('funnelChart').getContext('2d');
            new Chart(funnelCtx, {
                type: 'bar',
                data: {
                    labels: ['Total Users', 'Viewed Jobs', 'Clicked Jobs', 'Applied Jobs'],
                    datasets: [{
                        label: 'Users',
                        data: [
                            stats.total_users || 0,
                            engagement.viewed_jobs?.count || 0,
                            engagement.clicked_jobs?.count || 0,
                            engagement.applied_jobs?.count || 0
                        ],
                        backgroundColor: ['#667eea', '#4299e1', '#48bb78', '#ed8936'],
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateEngagementTable(data) {
            const tbody = document.getElementById('engagementTable');
            const total = data.total_users || 1;

            tbody.innerHTML = `
                <tr>
                    <td><strong>Jobs Viewed</strong></td>
                    <td>${data.viewed_jobs?.count || 0}</td>
                    <td>${Math.round((data.viewed_jobs?.count / total) * 100)}%</td>
                    <td>📊</td>
                </tr>
                <tr>
                    <td><strong>Jobs Clicked</strong></td>
                    <td>${data.clicked_jobs?.count || 0}</td>
                    <td>${Math.round((data.clicked_jobs?.count / total) * 100)}%</td>
                    <td>📈</td>
                </tr>
                <tr>
                    <td><strong>Jobs Applied</strong></td>
                    <td>${data.applied_jobs?.count || 0}</td>
                    <td>${Math.round((data.applied_jobs?.count / total) * 100)}%</td>
                    <td>✅</td>
                </tr>
            `;
        }
    </script>
</body>
</html>
