<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Location Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
            --light-bg: #f8f9fa;
            --border: #ecf0f1;
            --text: #2c3e50;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #ecf0f1;
                --text: #ecf0f1;
                --light-bg: #34495e;
                --border: #2c3e50;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--light-bg);
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .location-selector {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .location-selector label {
            font-weight: bold;
            color: var(--text);
        }

        .location-selector select {
            padding: 10px 15px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            background: white;
            color: var(--text);
        }

        .location-selector button {
            padding: 10px 25px;
            background: var(--info);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .location-selector button:hover {
            background: #2980b9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--info);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.primary {
            border-left-color: var(--primary);
        }

        .stat-card.success {
            border-left-color: var(--success);
        }

        .stat-card.warning {
            border-left-color: var(--warning);
        }

        .stat-card.danger {
            border-left-color: var(--danger);
        }

        .stat-card h3 {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 12px;
            color: #95a5a6;
        }

        .stat-card .percentage {
            font-size: 14px;
            color: var(--success);
            margin-top: 8px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .chart-container h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .table-container h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: var(--light-bg);
            padding: 12px;
            text-align: left;
            font-weight: bold;
            color: var(--text);
            border-bottom: 2px solid var(--border);
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        table tr:hover {
            background: rgba(52, 152, 219, 0.1);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.success {
            background: rgba(39, 174, 96, 0.2);
            color: var(--success);
        }

        .badge.danger {
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
        }

        .badge.info {
            background: rgba(52, 152, 219, 0.2);
            color: var(--info);
        }

        .badge.warning {
            background: rgba(243, 156, 18, 0.2);
            color: var(--warning);
        }

        .funnel-table {
            width: 100%;
        }

        .funnel-table tr td:first-child {
            font-weight: bold;
            width: 40%;
        }

        .funnel-bar {
            background: linear-gradient(90deg, var(--info), var(--success));
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
        }

        .error {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--danger);
            margin-bottom: 20px;
        }

        .success-message {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--success);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--text);
            margin-top: 30px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .location-selector {
                flex-direction: column;
                align-items: stretch;
            }

            .location-selector select,
            .location-selector button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Location-Based Management Dashboard</h1>
        <p>Centurion Nextgen Novagig - Analytics & Insights</p>
    </div>

    <div class="container">
        <!-- Location Selector -->
        <div class="location-selector">
            <label for="locationSelect">📍 Select Location:</label>
            <select id="locationSelect">
                <option value="">-- Choose a Location --</option>
            </select>
            <button onclick="loadDashboard()">Load Dashboard</button>
        </div>

        <!-- Error/Success Messages -->
        <div id="messageContainer"></div>

        <!-- Quick Stats -->
        <div id="statsContainer" style="display: none;">
            <div class="stats-grid" id="statsGrid">
                <!-- Stats will be populated here -->
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="chart-container">
                    <h2>📋 CV Upload Status</h2>
                    <div class="chart-wrapper">
                        <canvas id="cvChart"></canvas>
                    </div>
                </div>

                <div class="chart-container">
                    <h2>👁️ Engagement Funnel</h2>
                    <div class="chart-wrapper">
                        <canvas id="funnelChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Engagement Details Table -->
            <div class="table-container">
                <h2>📊 Engagement Funnel Details</h2>
                <table class="funnel-table" id="funnelTable">
                    <tr>
                        <th>Stage</th>
                        <th>Users</th>
                        <th>Percentage</th>
                        <th>Visual</th>
                    </tr>
                </table>
            </div>

            <!-- Users Table -->
            <div class="table-container" style="margin-top: 30px;">
                <h2>👥 User Details & Engagement</h2>
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>CV Upload</th>
                            <th>Jobs Viewed</th>
                            <th>Jobs Clicked</th>
                            <th>Jobs Applied</th>
                            <th>Last Active</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let cvChart = null;
        let funnelChart = null;
        const API_URL = '/api/admin';

        // Initialize dashboard on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadLocations();
        });

        async function loadLocations() {
            try {
                const response = await fetch(`${API_URL}/locations`);
                const data = await response.json();

                if (!data.success) {
                    showError('Failed to load locations');
                    return;
                }

                const select = document.getElementById('locationSelect');
                data.locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location;
                    select.appendChild(option);
                });
            } catch (error) {
                showError('Error loading locations: ' + error.message);
            }
        }

        async function loadDashboard() {
            const location = document.getElementById('locationSelect').value;

            if (!location) {
                showError('Please select a location');
                return;
            }

            document.getElementById('statsContainer').style.display = 'block';
            showLoading('Loading dashboard for ' + location + '...');

            try {
                // Load stats
                const statsResponse = await fetch(`${API_URL}/location-stats/${location}`);
                const statsData = await statsResponse.json();

                if (!statsData.success) {
                    showError('Failed to load stats');
                    return;
                }

                // Update stats cards
                updateStatsCards(statsData);

                // Load engagement data
                const engagementResponse = await fetch(`${API_URL}/location-engagement/${location}`);
                const engagementData = await engagementResponse.json();

                if (engagementData.success) {
                    updateFunnelTable(engagementData.funnel);
                    updateCharts(statsData, engagementData.funnel);
                }

                // Load users
                const usersResponse = await fetch(`${API_URL}/location-users/${location}`);
                const usersData = await usersResponse.json();

                if (usersData.success) {
                    updateUsersTable(usersData.users);
                }

                clearMessage();
                showSuccess('Dashboard loaded successfully for ' + location);
            } catch (error) {
                showError('Error loading dashboard: ' + error.message);
            }
        }

        function updateStatsCards(data) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = '';

            // Safe division: prevent division by zero
            const total = data.total_users || 1;
            const cvYesPercent = Math.round((data.cv_uploaded_yes / total) * 100);
            const cvNoPercent = Math.round((data.cv_uploaded_no / total) * 100);

            const stats = [
                {
                    title: 'Total Users',
                    value: data.total_users,
                    icon: '👥',
                    class: 'primary'
                },
                {
                    title: 'CV Uploaded (Yes)',
                    value: data.cv_uploaded_yes,
                    label: data.total_users === 0 ? 'No users' : `${cvYesPercent}% of users`,
                    class: 'success'
                },
                {
                    title: 'CV Uploaded (No)',
                    value: data.cv_uploaded_no,
                    label: data.total_users === 0 ? 'No users' : `${cvNoPercent}% of users`,
                    class: 'warning'
                },
                {
                    title: 'Active Users (Today)',
                    value: data.active_users_today,
                    class: 'info'
                },
                {
                    title: 'New Users (Today)',
                    value: data.new_users_today,
                    class: 'success'
                },
                {
                    title: 'Unique Users (Daily)',
                    value: data.unique_users_daily,
                    class: 'info'
                },
                {
                    title: 'Unique Users (Weekly)',
                    value: data.unique_users_weekly,
                    label: `↑ ${data.unique_users_weekly - data.unique_users_daily} from today`,
                    class: 'info'
                },
                {
                    title: 'Unique Users (Monthly)',
                    value: data.unique_users_monthly,
                    label: `↑ ${data.unique_users_monthly - data.unique_users_weekly} from weekly`,
                    class: 'info'
                }
            ];

            stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = `stat-card ${stat.class}`;
                card.innerHTML = `
                    <h3>${stat.title}</h3>
                    <div class="value">${stat.value}</div>
                    ${stat.label ? `<div class="label">${stat.label}</div>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function updateCharts(statsData, funnelData) {
            // Validate input data before rendering charts
            if (!statsData || !funnelData) {
                showError('Invalid data received from server');
                return;
            }

            // Validate CV chart data
            if (isNaN(statsData.cv_uploaded_yes) || isNaN(statsData.cv_uploaded_no) ||
                isNaN(statsData.total_users)) {
                showError('CV chart data contains invalid values');
                return;
            }

            // Validate funnel chart data
            if (isNaN(funnelData.total_users.count) ||
                isNaN(funnelData.viewed_jobs.count) ||
                isNaN(funnelData.clicked_jobs.count) ||
                isNaN(funnelData.applied_jobs.count)) {
                showError('Funnel chart data contains invalid values');
                return;
            }

            // CV Upload Chart
            const cvCtx = document.getElementById('cvChart').getContext('2d');
            if (cvChart) cvChart.destroy();

            cvChart = new Chart(cvCtx, {
                type: 'doughnut',
                data: {
                    labels: ['CV Uploaded (Yes)', 'CV Uploaded (No)'],
                    datasets: [{
                        data: [statsData.cv_uploaded_yes, statsData.cv_uploaded_no],
                        backgroundColor: ['#27ae60', '#e74c3c'],
                        borderColor: ['#229954', '#c0392b'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        datalabels: {
                            formatter: (value, ctx) => {
                                const sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = (value * 100 / sum).toFixed(1);
                                return percentage + '%';
                            },
                            color: '#fff',
                            font: {
                                weight: 'bold'
                            }
                        }
                    }
                },
                plugins: [Chart.plugins.datalabels]
            });

            // Funnel Chart
            const funnelCtx = document.getElementById('funnelChart').getContext('2d');
            if (funnelChart) funnelChart.destroy();

            const funnel = funnelData;
            funnelChart = new Chart(funnelCtx, {
                type: 'bar',
                data: {
                    labels: ['Total Users', 'Viewed Jobs', 'Clicked Jobs', 'Applied Jobs'],
                    datasets: [{
                        label: 'Users',
                        data: [
                            funnel.total_users.count,
                            funnel.viewed_jobs.count,
                            funnel.clicked_jobs.count,
                            funnel.applied_jobs.count
                        ],
                        backgroundColor: [
                            '#3498db',
                            '#9b59b6',
                            '#f39c12',
                            '#27ae60'
                        ],
                        borderRadius: 5,
                        borderSkipped: false
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateFunnelTable(funnel) {
            const tbody = document.getElementById('funnelTable').getElementsByTagName('tbody')[0] || document.getElementById('funnelTable');

            // Clear existing rows except header
            const rows = tbody.querySelectorAll('tr');
            rows.forEach((row, index) => {
                if (index > 0) row.remove();
            });

            const stages = [
                { name: 'Total Users', data: funnel.total_users },
                { name: 'Viewed Jobs', data: funnel.viewed_jobs },
                { name: 'Clicked Jobs', data: funnel.clicked_jobs },
                { name: 'Applied Jobs', data: funnel.applied_jobs },
                { name: 'Did Not Apply', data: funnel.not_applied }
            ];

            const table = document.getElementById('funnelTable');
            stages.forEach(stage => {
                const row = table.insertRow();
                const percentage = stage.data.percentage.toFixed(1);
                const width = Math.max(10, percentage) + '%';

                row.innerHTML = `
                    <td><strong>${stage.name}</strong></td>
                    <td>${stage.data.count}</td>
                    <td>${percentage}%</td>
                    <td><div class="funnel-bar" style="width: ${width}; max-width: 100%;">
                        ${percentage}%
                    </div></td>
                `;
            });
        }

        function updateUsersTable(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px;">No users found</td></tr>';
                return;
            }

            users.forEach(user => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${user.user_name}</td>
                    <td>${user.email}</td>
                    <td>
                        <span class="badge ${user.cv_uploaded ? 'success' : 'danger'}">
                            ${user.cv_uploaded ? '✅ Yes' : '❌ No'}
                        </span>
                    </td>
                    <td>${user.jobs_viewed}</td>
                    <td>${user.jobs_clicked}</td>
                    <td>${user.jobs_applied}</td>
                    <td>${user.last_active ? new Date(user.last_active).toLocaleString() : 'Never'}</td>
                `;
            });
        }

        function showLoading(message) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="loading">${message}</div>`;
        }

        function showError(message) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }

        function showSuccess(message) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="success-message">✅ ${message}</div>`;
        }

        function clearMessage() {
            document.getElementById('messageContainer').innerHTML = '';
        }
    </script>
</body>
</html>
