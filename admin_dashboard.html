<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Location Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg-dominant: #ffffff;
            --color-primary-corporate: #2563eb;
            --color-cta: #0d9488;
            --color-cta-hover: #0b7a70;
            --color-text-charcoal: #1f2937;
            --color-text-secondary: #374151;
            --color-surface-card: #f3f4f6;
            --color-border-default: #e2e8f0;
            --color-surface-raised: #f8fbff;
            --shadow-token-1: rgba(15, 23, 42, 0.06) 0px 4px 16px 0px, rgba(15, 23, 42, 0.05) 0px 1px 3px 0px;
            --radius-sm: 8px;
            --radius-md: 12px;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--color-surface-card);
            color: var(--color-text-charcoal);
        }

        .header {
            background: var(--color-bg-dominant);
            border-bottom: 1px solid var(--color-border-default);
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-token-1);
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-text-charcoal);
            margin-bottom: 6px;
        }

        .header-left p {
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .btn-logout {
            background: var(--color-primary-corporate);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
        }

        .btn-logout:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .selector-card {
            background: var(--color-bg-dominant);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 32px;
            box-shadow: var(--shadow-token-1);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--color-border-default);
        }

        .selector-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            min-width: 280px;
        }

        .selector-group label {
            font-weight: 600;
            color: var(--color-text-charcoal);
            font-size: 14px;
            white-space: nowrap;
        }

        .selector-group select {
            padding: 10px 12px;
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-sm);
            font-size: 14px;
            cursor: pointer;
            background: var(--color-bg-dominant);
            color: var(--color-text-charcoal);
            flex: 1;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .selector-group select:hover {
            border-color: var(--color-primary-corporate);
        }

        .selector-group select:focus {
            outline: none;
            border-color: var(--color-primary-corporate);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .selector-group select option {
            color: var(--color-text-charcoal);
            background: var(--color-bg-dominant);
        }

        .btn-load {
            padding: 10px 28px;
            background: var(--color-primary-corporate);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
            white-space: nowrap;
        }

        .btn-load:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            border-left: 4px solid #dc2626;
            display: none;
            border: 1px solid #fecaca;
        }

        .error-message.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--color-bg-dominant);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-token-1);
            border: 1px solid var(--color-border-default);
            border-top: 4px solid var(--color-primary-corporate);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
            transform: translateY(-4px);
        }

        .stat-card h3 {
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-text-charcoal);
            margin-bottom: 6px;
        }

        .stat-card .sublabel {
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--color-bg-dominant);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-token-1);
            border: 1px solid var(--color-border-default);
            transition: all 0.3s ease;
        }

        .chart-card:hover {
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        }

        .chart-card h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-charcoal);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
            margin-bottom: 16px;
        }

        .table-card {
            background: var(--color-bg-dominant);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-token-1);
            border: 1px solid var(--color-border-default);
            overflow: hidden;
        }

        .table-card h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-charcoal);
            padding: 24px;
            border-bottom: 1px solid var(--color-border-default);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background: var(--color-surface-card);
        }

        table th {
            padding: 14px 24px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--color-border-default);
        }

        table td {
            padding: 14px 24px;
            border-bottom: 1px solid var(--color-border-default);
            font-size: 14px;
            color: var(--color-text-charcoal);
        }

        table tbody tr:hover {
            background: var(--color-surface-raised);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .header-left h1 {
                font-size: 24px;
            }

            .container {
                padding: 16px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .selector-group {
                flex-direction: column;
                align-items: stretch;
            }

            .stat-card .value {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>📊 Analytics</h1>
            <p>Location-Based Management & Insights</p>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <div class="selector-card">
            <div class="selector-group">
                <label for="locationSelect">📍 Location:</label>
                <select id="locationSelect">
                    <option value="">-- Choose a Location --</option>
                </select>
            </div>
            <button class="btn-load" onclick="loadDashboard()">Load Dashboard</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div id="statsContainer" style="display: none;">
            <div class="stats-grid" id="statsGrid"></div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h2><span>📤</span>CV Upload Status</h2>
                    <div class="chart-wrapper">
                        <canvas id="cvChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h2><span>📈</span>Engagement Funnel</h2>
                    <div class="chart-wrapper">
                        <canvas id="funnelChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="table-card">
                <h2><span>👥</span>Engagement Details</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Stage</th>
                            <th>Users</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody id="engagementTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/admin';
        let cvChart = null;
        let funnelChart = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadLocations();
        });

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout failed:', error);
                alert('Logout failed. Please try again.');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('statsContainer').style.display = 'none';
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }

        async function loadLocations() {
            try {
                const response = await fetch(`${API_URL}/locations`);
                const data = await response.json();

                if (!data.success || !data.locations) {
                    showError('Failed to load locations');
                    return;
                }

                const select = document.getElementById('locationSelect');
                data.locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location;
                    select.appendChild(option);
                });

                if (data.locations.length > 0) {
                    select.value = data.locations[0];
                }
            } catch (error) {
                console.error('Error loading locations:', error);
                showError('Error loading locations: ' + error.message);
            }
        }

        async function loadDashboard() {
            const location = document.getElementById('locationSelect').value;

            if (!location) {
                showError('Please select a location');
                return;
            }

            hideError();
            document.getElementById('statsContainer').style.display = 'block';

            try {
                const [statsRes, engagementRes] = await Promise.all([
                    fetch(`${API_URL}/location-stats/${location}`),
                    fetch(`${API_URL}/location-engagement/${location}`)
                ]);

                if (!statsRes.ok || !engagementRes.ok) {
                    showError('Failed to load dashboard data');
                    return;
                }

                const statsData = await statsRes.json();
                const engagementData = await engagementRes.json();

                if (!statsData.success || !engagementData.success) {
                    showError('Failed to load dashboard data');
                    return;
                }

                updateDashboard(statsData, engagementData);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('Error: ' + error.message);
            }
        }

        function updateDashboard(stats, engagement) {
            updateStatsCards(stats);
            updateCharts(stats, engagement);
            updateEngagementTable(engagement);
        }

        function updateStatsCards(data) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value">${data.total_users || 0}</div>
                </div>
                <div class="stat-card" style="border-top-color: #0d9488;">
                    <h3>CV Uploaded</h3>
                    <div class="value">${data.cv_uploaded_yes || 0}</div>
                    <div class="sublabel">${data.total_users > 0 ? Math.round((data.cv_uploaded_yes / data.total_users) * 100) : 0}% of users</div>
                </div>
                <div class="stat-card" style="border-top-color: #f59e0b;">
                    <h3>Jobs Clicked</h3>
                    <div class="value">${data.total_jobs_clicked || 0}</div>
                </div>
                <div class="stat-card" style="border-top-color: #ef4444;">
                    <h3>Jobs Applied</h3>
                    <div class="value">${data.total_jobs_applied || 0}</div>
                </div>
            `;
        }

        function updateCharts(stats, engagement) {
            if (cvChart) cvChart.destroy();
            if (funnelChart) funnelChart.destroy();

            const cvCtx = document.getElementById('cvChart').getContext('2d');
            cvChart = new Chart(cvCtx, {
                type: 'doughnut',
                data: {
                    labels: ['CV Uploaded', 'No CV'],
                    datasets: [{
                        data: [stats.cv_uploaded_yes || 0, stats.cv_uploaded_no || 0],
                        backgroundColor: ['#0d9488', '#e5e7eb'],
                        borderColor: ['#ffffff', '#ffffff'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        datalabels: { color: '#fff', font: { weight: 'bold' } }
                    }
                }
            });

            const funnelCtx = document.getElementById('funnelChart').getContext('2d');
            funnelChart = new Chart(funnelCtx, {
                type: 'bar',
                data: {
                    labels: ['Total Users', 'Viewed Jobs', 'Clicked Jobs', 'Applied Jobs'],
                    datasets: [{
                        label: 'Users',
                        data: [
                            stats.total_users || 0,
                            engagement.viewed_jobs?.count || 0,
                            engagement.clicked_jobs?.count || 0,
                            engagement.applied_jobs?.count || 0
                        ],
                        backgroundColor: ['#2563eb', '#0d9488', '#f59e0b', '#ef4444'],
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateEngagementTable(data) {
            const tbody = document.getElementById('engagementTable');
            const total = data.total_users || 1;

            tbody.innerHTML = `
                <tr>
                    <td><strong>Jobs Viewed</strong></td>
                    <td>${data.viewed_jobs?.count || 0}</td>
                    <td>${Math.round((data.viewed_jobs?.count / total) * 100)}%</td>
                </tr>
                <tr>
                    <td><strong>Jobs Clicked</strong></td>
                    <td>${data.clicked_jobs?.count || 0}</td>
                    <td>${Math.round((data.clicked_jobs?.count / total) * 100)}%</td>
                </tr>
                <tr>
                    <td><strong>Jobs Applied</strong></td>
                    <td>${data.applied_jobs?.count || 0}</td>
                    <td>${Math.round((data.applied_jobs?.count / total) * 100)}%</td>
                </tr>
            `;
        }
    </script>
</body>
</html>
