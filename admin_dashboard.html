<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - User Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg-dominant: #ffffff;
            --color-primary-corporate: #2563eb;
            --color-cta: #0d9488;
            --color-cta-hover: #0b7a70;
            --color-text-charcoal: #1f2937;
            --color-text-secondary: #374151;
            --color-surface-card: #f3f4f6;
            --color-border-default: #e2e8f0;
            --color-surface-raised: #f8fbff;
            --shadow-token-1: rgba(15, 23, 42, 0.06) 0px 4px 16px 0px, rgba(15, 23, 42, 0.05) 0px 1px 3px 0px;
            --radius-sm: 8px;
            --radius-md: 12px;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--color-surface-card);
            color: var(--color-text-charcoal);
        }

        .header {
            background: var(--color-bg-dominant);
            border-bottom: 1px solid var(--color-border-default);
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-token-1);
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-text-charcoal);
            margin-bottom: 6px;
        }

        .header-left p {
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .btn-logout {
            background: var(--color-primary-corporate);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
        }

        .btn-logout:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 32px;
        }

        .selector-card {
            background: var(--color-bg-dominant);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 32px;
            box-shadow: var(--shadow-token-1);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--color-border-default);
        }

        .selector-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            min-width: 200px;
        }

        .selector-group label {
            font-weight: 600;
            color: var(--color-text-charcoal);
            font-size: 14px;
            white-space: nowrap;
        }

        .selector-group select {
            padding: 10px 12px;
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-sm);
            font-size: 14px;
            cursor: pointer;
            background: var(--color-bg-dominant);
            color: var(--color-text-charcoal);
            flex: 1;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .selector-group select:focus {
            outline: none;
            border-color: var(--color-primary-corporate);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-load {
            padding: 10px 28px;
            background: var(--color-primary-corporate);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
            white-space: nowrap;
        }

        .btn-load:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            border-left: 4px solid #dc2626;
            display: none;
            border: 1px solid #fecaca;
        }

        .error-message.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--color-bg-dominant);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-token-1);
            border: 1px solid var(--color-border-default);
            border-top: 4px solid var(--color-primary-corporate);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
            transform: translateY(-4px);
        }

        .stat-card h3 {
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-text-charcoal);
        }

        .stat-card .sublabel {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-top: 6px;
        }

        .table-card {
            background: var(--color-bg-dominant);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-token-1);
            border: 1px solid var(--color-border-default);
            overflow: hidden;
        }

        .table-card h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-charcoal);
            padding: 24px;
            border-bottom: 1px solid var(--color-border-default);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        table thead {
            background: var(--color-surface-card);
        }

        table th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--color-border-default);
            white-space: nowrap;
        }

        table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--color-border-default);
            font-size: 14px;
            color: var(--color-text-charcoal);
        }

        table tbody tr:hover {
            background: var(--color-surface-raised);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-yes {
            background: #dcfce7;
            color: #166534;
        }

        .badge-no {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-active {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-inactive {
            background: #f3f4f6;
            color: #6b7280;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--color-border-default);
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--color-text-secondary);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            margin-bottom: -1px;
        }

        .tab-btn.active {
            color: var(--color-primary-corporate);
            border-bottom-color: var(--color-primary-corporate);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .updates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .update-card {
            background: var(--color-bg-dominant);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-token-1);
            border: 1px solid var(--color-border-default);
        }

        .update-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-charcoal);
            margin-bottom: 16px;
        }

        .update-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--color-border-default);
        }

        .update-stat:last-child {
            border-bottom: none;
        }

        .update-stat-label {
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .update-stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-text-charcoal);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .container {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 10px 8px;
            }

            .selector-group {
                flex-direction: column;
                align-items: stretch;
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>📊 Admin Analytics</h1>
            <p>Comprehensive User & Engagement Analytics</p>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <div class="selector-card">
            <div class="selector-group">
                <label for="locationSelect">📍 Location:</label>
                <select id="locationSelect">
                    <option value="">-- All Locations --</option>
                </select>
            </div>
            <button class="btn-load" onclick="loadDashboard()">Load Dashboard</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div id="statsContainer" style="display: none;">
            <!-- Summary Stats -->
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--color-text-charcoal);">Summary Metrics</h2>
            <div class="stats-grid" id="statsGrid"></div>

            <!-- Tabs for different views -->
            <div class="tabs" style="margin-top: 40px;">
                <button class="tab-btn active" onclick="switchTab('users-view')">👥 Users</button>
                <button class="tab-btn" onclick="switchTab('updates-view')">📈 Updates</button>
            </div>

            <!-- Users Data Table -->
            <div id="users-view" class="tab-content active">
                <div class="table-card">
                    <h2><span>📋</span>User Details</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Registration #</th>
                                    <th>CV Uploaded</th>
                                    <th>Jobs Viewed</th>
                                    <th>Jobs Clicked</th>
                                    <th>Jobs Applied</th>
                                    <th>First Login</th>
                                    <th>Last Active</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Updates Stats -->
            <div id="updates-view" class="tab-content">
                <div class="updates-grid" id="updatesGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/admin';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadLocations();
            await loadDashboard();
        });

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout failed:', error);
                alert('Logout failed. Please try again.');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('statsContainer').style.display = 'none';
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function loadLocations() {
            try {
                const response = await fetch(`${API_URL}/locations`);
                const data = await response.json();

                if (!data.success || !data.locations) {
                    return;
                }

                const select = document.getElementById('locationSelect');
                data.locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading locations:', error);
            }
        }

        async function loadDashboard() {
            const location = document.getElementById('locationSelect').value;
            hideError();
            document.getElementById('statsContainer').style.display = 'block';

            try {
                const [usersRes, statsRes, updatesRes] = await Promise.all([
                    fetch(`${API_URL}/users${location ? '?location=' + location : ''}`),
                    fetch(`${API_URL}/location-stats/${location || 'all'}`),
                    fetch(`${API_URL}/user-updates${location ? '?location=' + location : ''}`)
                ]);

                if (!usersRes.ok || !statsRes.ok || !updatesRes.ok) {
                    showError('Failed to load dashboard data');
                    return;
                }

                const usersData = await usersRes.json();
                const statsData = await statsRes.json();
                const updatesData = await updatesRes.json();

                if (!usersData.success || !statsData.success || !updatesData.success) {
                    showError('Failed to load dashboard data');
                    return;
                }

                updateDashboard(usersData, statsData, updatesData);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('Error: ' + error.message);
            }
        }

        function updateDashboard(usersData, statsData, updatesData) {
            updateStats(statsData, usersData);
            updateUsersTable(usersData);
            updateUpdates(updatesData);
        }

        function updateStats(statsData, usersData) {
            const stats = statsData.data || statsData;
            const users = usersData.users || [];

            const totalUsers = users.length;
            const cvUploaded = users.filter(u => u.cv_uploaded).length;
            const jobsViewed = users.filter(u => u.jobs_viewed > 0).length;
            const jobsClicked = users.filter(u => u.jobs_clicked > 0).length;
            const jobsApplied = users.filter(u => u.jobs_applied > 0).length;
            const activeUsers = users.filter(u => u.is_active).length;
            const uniqueUsers = new Set(users.map(u => u.email)).size;
            const firstTimeLogin = users.filter(u => u.is_first_login).length;

            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value">${totalUsers}</div>
                </div>
                <div class="stat-card" style="border-top-color: #0d9488;">
                    <h3>CV Uploaded</h3>
                    <div class="value">${cvUploaded}</div>
                    <div class="sublabel">${totalUsers > 0 ? Math.round((cvUploaded / totalUsers) * 100) : 0}% of users</div>
                </div>
                <div class="stat-card" style="border-top-color: #f59e0b;">
                    <h3>Active Users</h3>
                    <div class="value">${activeUsers}</div>
                    <div class="sublabel">${totalUsers > 0 ? Math.round((activeUsers / totalUsers) * 100) : 0}% active</div>
                </div>
                <div class="stat-card" style="border-top-color: #8b5cf6;">
                    <h3>Unique Users</h3>
                    <div class="value">${uniqueUsers}</div>
                </div>
                <div class="stat-card" style="border-top-color: #ef4444;">
                    <h3>First Time Login</h3>
                    <div class="value">${firstTimeLogin}</div>
                </div>
                <div class="stat-card" style="border-top-color: #06b6d4;">
                    <h3>Jobs Clicked</h3>
                    <div class="value">${jobsClicked}</div>
                    <div class="sublabel">${totalUsers > 0 ? Math.round((jobsClicked / totalUsers) * 100) : 0}% engagement</div>
                </div>
            `;
        }

        function updateUsersTable(usersData) {
            const users = usersData.users || [];
            const tbody = document.getElementById('usersTable');

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 32px;">No users found</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td><strong>${user.name || 'N/A'}</strong></td>
                    <td>${user.email}</td>
                    <td>${user.registration_num || 'N/A'}</td>
                    <td><span class="badge ${user.cv_uploaded ? 'badge-yes' : 'badge-no'}">${user.cv_uploaded ? 'Yes' : 'No'}</span></td>
                    <td>${user.jobs_viewed || 0}</td>
                    <td>${user.jobs_clicked || 0}</td>
                    <td>${user.jobs_applied || 0}</td>
                    <td>${formatDate(user.first_login)}</td>
                    <td>${formatDate(user.last_active)}</td>
                </tr>
            `).join('');
        }

        function updateUpdates(updatesData) {
            const updates = updatesData.data || {};
            const grid = document.getElementById('updatesGrid');

            grid.innerHTML = `
                <div class="update-card">
                    <h3>Daily Updates</h3>
                    <div class="update-stat">
                        <span class="update-stat-label">New Users</span>
                        <span class="update-stat-value">${updates.daily?.new_users || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">CV Uploads</span>
                        <span class="update-stat-value">${updates.daily?.cv_uploads || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">Jobs Clicked</span>
                        <span class="update-stat-value">${updates.daily?.jobs_clicked || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">Jobs Applied</span>
                        <span class="update-stat-value">${updates.daily?.jobs_applied || 0}</span>
                    </div>
                </div>

                <div class="update-card">
                    <h3>Weekly Updates</h3>
                    <div class="update-stat">
                        <span class="update-stat-label">New Users</span>
                        <span class="update-stat-value">${updates.weekly?.new_users || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">CV Uploads</span>
                        <span class="update-stat-value">${updates.weekly?.cv_uploads || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">Jobs Clicked</span>
                        <span class="update-stat-value">${updates.weekly?.jobs_clicked || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">Jobs Applied</span>
                        <span class="update-stat-value">${updates.weekly?.jobs_applied || 0}</span>
                    </div>
                </div>

                <div class="update-card">
                    <h3>Monthly Updates</h3>
                    <div class="update-stat">
                        <span class="update-stat-label">New Users</span>
                        <span class="update-stat-value">${updates.monthly?.new_users || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">CV Uploads</span>
                        <span class="update-stat-value">${updates.monthly?.cv_uploads || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">Jobs Clicked</span>
                        <span class="update-stat-value">${updates.monthly?.jobs_clicked || 0}</span>
                    </div>
                    <div class="update-stat">
                        <span class="update-stat-label">Jobs Applied</span>
                        <span class="update-stat-value">${updates.monthly?.jobs_applied || 0}</span>
                    </div>
                </div>
            `;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
