<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Opportunities & Consultancies - Job Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .nav-buttons a, .nav-buttons button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            transition: background 0.3s;
        }

        .nav-buttons a:hover, .nav-buttons button:hover {
            background: #764ba2;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters label {
            font-weight: bold;
            color: #333;
        }

        .filters select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            background: white;
            cursor: pointer;
        }

        .opportunities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .opportunity-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid #667eea;
        }

        .opportunity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .opportunity-card h3 {
            color: #667eea;
            font-size: 1.4em;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .opportunity-card .company {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .opportunity-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            font-size: 0.95em;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
        }

        .description {
            color: #555;
            line-height: 1.6;
            margin: 15px 0;
            min-height: 80px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #666;
        }

        .tag.category {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .tag.experience {
            background: #e3f2fd;
            color: #1565c0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: background 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .btn-details {
            background: #667eea;
            color: white;
        }

        .btn-details:hover {
            background: #764ba2;
        }

        .btn-apply {
            background: #2ecc71;
            color: white;
        }

        .btn-apply:hover {
            background: #27ae60;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #fadbd8;
            color: #c0392b;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #c0392b;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 10px;
            color: #999;
        }

        .empty-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        @media (max-width: 768px) {
            .opportunities-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filters select, .search-box input {
                width: 100%;
            }

            .buttons {
                flex-direction: column;
            }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            overflow: auto;
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #333;
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .modal-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .modal-meta-item {
            display: flex;
            flex-direction: column;
        }

        .modal-meta-item label {
            font-weight: bold;
            color: #667eea;
            font-size: 0.9em;
        }

        .modal-meta-item value {
            color: #333;
            margin-top: 5px;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .skill {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📚 Remote Opportunities & Consultancies</h1>
            <p>Explore remote research, consultancy, and specialized roles in agriculture, geospatial science, remote sensing, and tech. Perfect for students and faculty looking for contract work, consulting opportunities, and research positions.</p>
            <div class="nav-buttons">
                <a href="/">← Back to Job Portal</a>
                <button onclick="location.reload()">🔄 Refresh</button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <label for="categoryFilter">Category:</label>
            <select id="categoryFilter" onchange="filterOpportunities()">
                <option value="">All Categories</option>
                <option value="Remote Sensing">Remote Sensing</option>
                <option value="Agriculture Tech">Agriculture Tech</option>
                <option value="Geospatial">Geospatial</option>
                <option value="Data Engineering">Data Engineering</option>
                <option value="Research">Research</option>
                <option value="Consultancy">Consultancy</option>
            </select>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search opportunities..." onkeyup="filterOpportunities()">
            </div>
        </div>

        <!-- Opportunities Grid -->
        <div id="opportunitiesContainer" class="opportunities-grid"></div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API = "";
        let allOpportunities = [];

        // Initialize
        window.onload = function() {
            loadOpportunities();
        };

        async function loadOpportunities() {
            try {
                const container = document.getElementById('opportunitiesContainer');
                container.innerHTML = '<div class="loading">Loading opportunities...</div>';

                const response = await fetch(`${API}/api/opportunities`);
                const data = await response.json();

                if (data.success) {
                    allOpportunities = data.opportunities;
                    displayOpportunities(allOpportunities);
                } else {
                    container.innerHTML = '<div class="error">Failed to load opportunities</div>';
                }
            } catch (error) {
                console.error('Error loading opportunities:', error);
                document.getElementById('opportunitiesContainer').innerHTML =
                    '<div class="error">Error loading opportunities. Please try again later.</div>';
            }
        }

        function displayOpportunities(opportunities) {
            const container = document.getElementById('opportunitiesContainer');

            if (opportunities.length === 0) {
                container.innerHTML = `
                    <div class="empty" style="grid-column: 1/-1;">
                        <div class="empty-icon">🔍</div>
                        <h3>No opportunities found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            opportunities.forEach(opp => {
                const card = document.createElement('div');
                card.className = 'opportunity-card';
                card.innerHTML = `
                    <h3>${escapeHtml(opp.title)}</h3>
                    <div class="company">${escapeHtml(opp.company)}</div>

                    <div class="meta">
                        <div class="meta-item">📍 ${escapeHtml(opp.location)}</div>
                        <div class="meta-item">💼 ${escapeHtml(opp.type)}</div>
                        <div class="meta-item">💰 ${escapeHtml(opp.salary)}</div>
                    </div>

                    <div class="description">${escapeHtml(opp.description.substring(0, 150))}...</div>

                    <div class="tags">
                        <span class="tag category">${escapeHtml(opp.category)}</span>
                        <span class="tag experience">${escapeHtml(opp.experience)}</span>
                        <span class="tag">${escapeHtml(opp.source)}</span>
                    </div>

                    <div class="buttons">
                        <button class="btn btn-details" onclick="showDetails(${opp.id})">View Details</button>
                        <a href="${escapeHtml(opp.url)}" target="_blank" class="btn btn-apply">Apply Now →</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterOpportunities() {
            const category = document.getElementById('categoryFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allOpportunities;

            if (category) {
                filtered = filtered.filter(opp => opp.category === category);
            }

            if (search) {
                filtered = filtered.filter(opp =>
                    opp.title.toLowerCase().includes(search) ||
                    opp.company.toLowerCase().includes(search) ||
                    opp.description.toLowerCase().includes(search) ||
                    opp.skills.some(skill => skill.toLowerCase().includes(search))
                );
            }

            displayOpportunities(filtered);
        }

        async function showDetails(oppId) {
            try {
                const response = await fetch(`${API}/api/opportunities/${oppId}`);
                const data = await response.json();

                if (data.success) {
                    const opp = data.opportunity;
                    const modal = document.getElementById('detailModal');
                    const modalBody = document.getElementById('modalBody');

                    modalBody.innerHTML = `
                        <h2>${escapeHtml(opp.title)}</h2>
                        <div class="company">${escapeHtml(opp.company)}</div>

                        <div class="modal-meta">
                            <div class="modal-meta-item">
                                <label>📍 Location</label>
                                <value>${escapeHtml(opp.location)}</value>
                            </div>
                            <div class="modal-meta-item">
                                <label>💼 Type</label>
                                <value>${escapeHtml(opp.type)}</value>
                            </div>
                            <div class="modal-meta-item">
                                <label>💰 Salary</label>
                                <value>${escapeHtml(opp.salary)}</value>
                            </div>
                            <div class="modal-meta-item">
                                <label>📅 Posted</label>
                                <value>${escapeHtml(opp.posted_date)}</value>
                            </div>
                            <div class="modal-meta-item">
                                <label>🏢 Source</label>
                                <value>${escapeHtml(opp.source)}</value>
                            </div>
                            <div class="modal-meta-item">
                                <label>🏷️ Category</label>
                                <value>${escapeHtml(opp.category)}</value>
                            </div>
                        </div>

                        <h3 style="margin-top: 25px; color: #667eea;">Description</h3>
                        <p style="line-height: 1.8; color: #555;">${escapeHtml(opp.description)}</p>

                        <h3 style="margin-top: 25px; color: #667eea;">Required Skills</h3>
                        <div class="skills-list">
                            ${opp.skills.map(skill => `<span class="skill">${escapeHtml(skill)}</span>`).join('')}
                        </div>

                        <h3 style="margin-top: 25px; color: #667eea;">Experience Required</h3>
                        <p style="color: #555; font-size: 1.05em;">${escapeHtml(opp.experience)}</p>

                        <div class="buttons" style="margin-top: 30px;">
                            <a href="${escapeHtml(opp.url)}" target="_blank" class="btn btn-apply" style="flex: 1;">Apply Now on ${escapeHtml(opp.source)} →</a>
                        </div>
                    `;

                    modal.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading details:', error);
                alert('Failed to load opportunity details');
            }
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
